[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "horizon-protocol"
version = "0.1.0.dev0"
description = "The Robotensor Horizon competition's protocol: a policy served in its own process, and the demonstration bundle and result files around it."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# Installed beside a simulator's pins on one side and a model's pins on the other: keep it to this.
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/horizon_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
markers = [
  "slow: takes minutes",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
